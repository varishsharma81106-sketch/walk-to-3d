[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walk-to-3d"
version = "0.1.0"
description = "Private indoor 3D reconstruction from phone walkthrough video."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-python>=4.8",
  "matplotlib>=3.7",
  "gradio>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["walk3d*"]
